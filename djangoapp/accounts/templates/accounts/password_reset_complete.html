{% extends "blog/partials/base.html" %}

{% block title %}Senha alterada | {{ site_setup.title|default:"Blog" }}{% endblock title %}

{% block content %}
    <section class="auth container">
        <div class="auth-card">
            <h1 class="auth-title">Senha <span class="gradient-text">alterada</span></h1>
            <p class="auth-subtitle">Pronto! Agora é só entrar com a senha nova.</p>
            <a href="{% url 'accounts:login' %}" class="btn btn-primary btn-block">
                Entrar <span class="btn-arrow">&rarr;</span>
            </a>
        </div>
    </section>
{% endblock content %}
