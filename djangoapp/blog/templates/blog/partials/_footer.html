<footer class="site-footer">
    <div class="container footer-inner">
        <div class="footer-text">
            <p>
                &copy; {% now "Y" %} <strong class="gradient-text">Bruno</strong>.
                Todos os direitos reservados.
            </p>
            <p>
                Contato:
                <a href="mailto:Bruno.h.souza258@gmail.com" class="footer-email">Bruno.h.souza258@gmail.com</a>
            </p>
        </div>

        {% if site_setup.menulink_set.exists %}
            <ul class="footer-links">
                {% for link in site_setup.menulink_set.all %}
                    <li>
                        <a href="{{ link.url_or_path }}"
                           {% if link.new_tab %}target="_blank" rel="noopener noreferrer"{% endif %}>{{ link.text }}</a>
                    </li>
                {% endfor %}
            </ul>
        {% endif %}

        <a href="#topo" class="back-to-top" aria-label="Voltar ao topo">&uarr;</a>
    </div>
</footer>
