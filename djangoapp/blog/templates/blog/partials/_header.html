<header class="site-header">
    <div class="container header-inner">
        <a href="{% url 'blog:index' %}" class="logo">
            {# Filtros em cadeia: usa "B" se não tiver título, pega a 1ª letra e deixa maiúscula #}
            <span class="logo-mark">{{ site_setup.title|default:"B"|first|upper }}</span>
            <span class="gradient-text">{{ site_setup.title|default:"Blog" }}</span>
        </a>

        {% comment %}
            Menu mobile sem JavaScript: o checkbox fica escondido e o <label>
            (botão hambúrguer) marca/desmarca ele. O CSS usa :checked para
            abrir o menu. Veja ".menu-toggle:checked" no style.css.
        {% endcomment %}
        {# No celular, o "Olá, Nome" fica escondido dentro do menu; este chip mostra quem está logado sem precisar abrir #}
        {% if user.is_authenticated %}
            <a href="{% url 'accounts:profile' %}" class="user-chip" title="Minha conta">
                {% include "accounts/_avatar.html" with url=user_avatar_url name=display_name %}
                <span class="user-name">{{ display_name }}</span>
            </a>
        {% endif %}
        <input type="checkbox" id="menu-toggle" class="menu-toggle">
        <label for="menu-toggle" class="menu-button" aria-label="Abrir menu">
            <span></span>
        </label>

        <nav class="main-nav" aria-label="Menu principal">
            <div class="nav-content">
                {% if not site_setup or site_setup.show_menu %}
                    <ul class="menu">
                        <li><a href="{% url 'blog:index' %}" class="menu-link">Início</a></li>
                        {% comment %}
                            menulink_set é criado automaticamente pelo Django por causa
                            da ForeignKey de MenuLink para SiteSetup.
                            rel="noopener" impede a aba nova de controlar esta aba (segurança).
                        {% endcomment %}
                        {% for link in site_setup.menulink_set.all %}
                            <li>
                                <a href="{{ link.url_or_path }}" class="menu-link"
                                   {% if link.new_tab %}target="_blank" rel="noopener noreferrer"{% endif %}>
                                    {{ link.text }}
                                </a>
                            </li>
                        {% endfor %}
                        <li><a href="{% url 'feedback:feedback' %}" class="menu-link">Feedback</a></li>
                    </ul>
                {% endif %}

                {% if not site_setup or site_setup.show_search %}
                    {# method="get" coloca a busca na URL (?q=termo); o value mantém o texto digitado depois de buscar #}
                    <form class="search-form" action="{% url 'blog:index' %}" method="get" role="search">
                        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
                            <circle cx="11" cy="11" r="7"></circle>
                            <path d="m20 20-3.5-3.5"></path>
                        </svg>
                        <input type="search" name="q" class="search-input" placeholder="Buscar posts..." value="{{ request.GET.q }}" aria-label="Buscar posts">
                    </form>
                {% endif %}

                {# "user" vem do context processor de auth do Django #}
                <div class="auth-links">
                    {% if user.is_authenticated %}
                        {# display_name = só o primeiro nome (accounts/context_processors.py) #}
                        <a href="{% url 'accounts:profile' %}" class="auth-greeting" title="Minha conta">
                            {% include "accounts/_avatar.html" with url=user_avatar_url name=display_name %}
                            Olá, <strong>{{ display_name }}</strong>
                        </a>
                        <form action="{% url 'accounts:logout' %}" method="post">
                            {% csrf_token %}
                            <button type="submit" class="btn btn-ghost btn-sm">Sair</button>
                        </form>
                    {% else %}
                        <a href="{% url 'accounts:login' %}" class="btn btn-ghost btn-sm">Entrar</a>
                        <a href="{% url 'accounts:register' %}" class="btn btn-primary btn-sm">Criar conta</a>
                    {% endif %}
                </div>
            </div>
        </nav>
    </div>
</header>
