services:
  djangoapp:
    container_name: djangoapp
    build:
      context: .
    # "porta do seu PC : porta do container"
    ports:
      - 8000:8000
    # Bind mounts: a pasta do seu PC aparece dentro do container. Por isso
    # editar o código no VS Code já reflete no servidor sem rebuild.
    volumes:
      - ./djangoapp:/djangoapp
      - ./data/web/static:/data/web/static/
      - ./data/web/media:/data/web/media/
    env_file:
      - ./dotenv_files/.env
    # Só inicia o Django quando o healthcheck do Postgres passar
    # (um depends_on simples só espera o container iniciar, não o banco).
    depends_on:
      psql:
        condition: service_healthy
      ollama:
        condition: service_started
    restart: unless-stopped
  psql:
    container_name: psql
    image: postgres:16-alpine
    # Os dados do banco ficam salvos no seu PC, então não somem quando
    # o container é removido com "docker compose down".
    volumes:
      - ./data/postgres/data:/var/lib/postgresql/data/
    env_file:
      - ./dotenv_files/.env
    restart: unless-stopped
    # pg_isready pergunta ao Postgres se ele já aceita conexões.
    # O "$$" escapa o "$" para a variável ser lida dentro do container,
    # e não pelo docker compose.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
  # IA local (Ollama). Roda na CPU; os modelos baixados ficam no volume
  # "ollama_data" (fora do OneDrive, porque são arquivos grandes).
  # Sem "ports": só o Django acessa, pelo endereço http://ollama:11434.
  ollama:
    container_name: ollama
    # Versão fixa: "latest" pode trazer uma atualização inesperada.
    image: ollama/ollama:0.35.1
    volumes:
      - ollama_data:/root/.ollama
    environment:
      # Mantém o modelo carregado na memória por 30 min após a última
      # pergunta, para a próxima resposta não demorar a começar.
      - OLLAMA_KEEP_ALIVE=30m
      # No máximo 10 perguntas esperando na fila; as demais são recusadas
      # na hora em vez de travar o servidor.
      - OLLAMA_MAX_QUEUE=10
    # Limite de recursos: mesmo com muitas perguntas, a IA não consegue
    # usar toda a CPU e memória do seu PC.
    cpus: 6
    mem_limit: 5g
    restart: unless-stopped

volumes:
  ollama_data:
